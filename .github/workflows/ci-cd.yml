name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        uses: docker/setup-qemu-action@v3

      - name: Create root .env file
        run: |
          echo "POSTGRES_USER=${{ secrets.DB_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
           echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
          echo "✅.env created:"
          cat .env

      - name: Create backend .env file
        run: |
          mkdir -p backend
          echo "PORT=${{secrets.BACKEND_PORT}}" > backend/.env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> backend/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> backend/.env
          echo "DB_USER=secrets.DB_USER " >> backend/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> backend/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "GITHUB_API_URL=https://api.github.com" >> backend/.env
          echo "✅ backend/.env created:"
          cat backend/.env
      - name: Create frontend .env file
        run: |
          mkdir -p frontend
          echo "NEXT_PUBLIC_API_URL=http://localhost:${{ secrets.BACKEND_PORT }}/api" > frontend/.env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> frontend/.env
          echo "✅ frontend/.env created:"
          cat frontend/.env

      - name: Install backend dependencies (for lint)
        working-directory: ./backend
        run: npm install

      - name: Install frontend dependencies (for lint)
        working-directory: ./frontend
        run: npm install

      - name: Run backend lint
        working-directory: ./backend
        run: npm run lint

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build containers
        run: docker compose -f docker-compose.yml build

      - name: Start containers
        run: docker compose -f docker-compose.yml up -d db backend frontend

      - name: Wait for DB to be healthy
        run: |
          echo "Waiting for Postgres healthcheck..."
          for i in {1..30}; do
            if docker exec $(docker ps -qf "name=db") pg_isready -U postgres; then
              echo "Database is ready ✅"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Stop containers
        run: docker compose -f docker-compose.yml down
